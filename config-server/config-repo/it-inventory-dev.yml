server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itinventory}
    username: ${DB_USERNAME:itinventory}
    password: ${DB_PASSWORD:inventory123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:inventory}
    password: ${RABBITMQ_PASSWORD:inventory123}

  batch:
    jdbc:
      initialize-schema: always

services:
  location:
    url: ${LOCATION_SERVICE_URL:http://localhost:8081}